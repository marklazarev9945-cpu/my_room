<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// COORDINATES: x = width [-2.5,2.5], z = depth [-2,2], y = height.
const W=5,D=4,H=2.8, $=s=>document.querySelector(s);
let scene,camera,renderer,controls,ground,lighting,dayMix=1,dayTarget=1,wallMode='back';
const materials={},wallGroups={},lamps=[],fans=[],animated=[],pickables=[],translucentWalls=[];
const cameraHome=new THREE.Vector3(7.6,6.9,8.8), targetHome=new THREE.Vector3(0,1.05,0);
const transition={active:false,start:0,duration:900,fromPos:new THREE.Vector3(),toPos:new THREE.Vector3(),fromTarget:new THREE.Vector3(),toTarget:new THREE.Vector3(),fromZoom:1,toZoom:1};
const clock=new THREE.Clock();
const c=(hex,roughness=.82,metalness=0)=>new THREE.MeshStandardMaterial({color:hex,roughness,metalness});
const mat=(key,hex,r=.82,met=0)=>materials[key]=c(hex,r,met);
function createMaterials(){mat('sage','#b7c5b4');mat('cream','#e8dfd0');mat('wood','#ad7d54');mat('planks','#c99c70');mat('walnut','#805943');mat('edge','#704d39');mat('white','#e9e5db');mat('ivory','#f7eee2');mat('orange','#db8c54');mat('blue','#536a84');mat('navy','#32465b');mat('graphite','#353d45');mat('black','#22262c');mat('metal','#727b82',.42,.65);mat('silver','#bec6c7',.44,.45);mat('blanket','#7d98a6');mat('pillow','#d6b7a1');mat('green','#628c6d');mat('greenDark','#426e59');mat('pot','#a06d50');mat('rug','#d9bca0');mat('gold','#d9b77b',.55,.45);mat('screen','#111a2a',.25,.1);mat('pink','#d8a6a2');mat('purple','#7c76b2');mat('glass','#8cbdd0',.15,.08);}
const group=(parent,x=0,y=0,z=0)=>{const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g};
function mesh(parent,geo,material,x=0,y=0,z=0,name=''){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(name){m.name=name;pickables.push(m)}parent.add(m);return m}
function box(p,w,h,d,x,y,z,m,name){return mesh(p,new THREE.BoxGeometry(w,h,d),m,x,y,z,name)}
function roundBox(p,w,h,d,x,y,z,m,r=.06,name=''){const sh=new THREE.Shape(),hw=w/2,hh=h/2,rrDepth=Math.min(r,d*.42),rr=Math.min(rrDepth,hw,hh);sh.moveTo(-hw+rr,-hh);sh.lineTo(hw-rr,-hh);sh.quadraticCurveTo(hw,-hh,hw,-hh+rr);sh.lineTo(hw,hh-rr);sh.quadraticCurveTo(hw,hh,hw-rr,hh);sh.lineTo(-hw+rr,hh);sh.quadraticCurveTo(-hw,hh,-hw,hh-rr);sh.lineTo(-hw,-hh+rr);sh.quadraticCurveTo(-hw,-hh,-hw+rr,-hh);const geo=new THREE.ExtrudeGeometry(sh,{depth:d-2*rrDepth,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:r,bevelThickness:r,curveSegments:4});geo.translate(0,0,-d/2+rrDepth);return mesh(p,geo,m,x,y,z,name)}
function cyl(p,rad,hei,x,y,z,m,seg=16){return mesh(p,new THREE.CylinderGeometry(rad,rad,hei,seg),m,x,y,z)}
function sphere(p,rad,x,y,z,m,sw=12,sh=9){return mesh(p,new THREE.SphereGeometry(rad,sw,sh),m,x,y,z)}
function line(p,points,rad,m){const curve=new THREE.CatmullRomCurve3(points.map(q=>new THREE.Vector3(...q)));return mesh(p,new THREE.TubeGeometry(curve,Math.max(8,points.length*5),rad,5,false),m)}
function canvasTex(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');draw(ctx,w,h);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
function labelTex(title,sub,bg='#34465f',fg='#f8e6ca'){return canvasTex(512,640,(x,w,h)=>{x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle='#ffffff17';for(let i=0;i<28;i++){x.fillRect((i*97)%w,(i*131)%h,3+i%5,50+i%65)}x.fillStyle=fg;x.font='bold 58px sans-serif';x.textAlign='center';x.fillText(title,w/2,150);x.font='24px sans-serif';x.fillText(sub,w/2,196);x.strokeStyle='#ffffff75';x.lineWidth=8;x.beginPath();x.arc(255,385,115,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(155,480);x.lineTo(255,290);x.lineTo(355,480);x.stroke()})}
function canvasPlane(p,w,h,x,y,z,texture,name){const m=mesh(p,new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide}),x,y,z,name);return m}
function scatterBooks(p,n,x,y,z,scale=.1,vertical=true){const colors=[materials.blue,materials.orange,materials.green,materials.navy,materials.pink,materials.cream,materials.purple];for(let i=0;i<n;i++){const width=scale*(.48+(i*7%5)*.09);const height=scale*(1.3+(i*11%6)*.18);if(vertical){box(p,width,height,scale*.65,x+i*scale*.65,y+height/2,z,colors[i%colors.length]);}else{box(p,scale*1.5,scale*.19,scale,x,y+i*scale*.22,z,colors[i%colors.length])}}}
function createFloor(){ground=group(scene);box(ground,5.28,.26,4.28,0,-.23,0,materials.graphite);box(ground,5.13,.12,4.13,0,-.055,0,materials.walnut);for(let j=0;j<30;j++){const z=-1.94+j*.133;for(let k=0;k<9;k++){const x=-2.5+k*.57+(j%2)*.285;const plank=box(ground,.565,.018,.124,x,.005,z,(j+k)%5===0?materials.wood:materials.planks);plank.receiveShadow=true}}for(let x of [-2.56,2.56])box(ground,.07,.13,4.27,x,-.09,0,materials.edge);for(let z of [-2.07,2.07])box(ground,5.15,.13,.07,0,-.09,z,materials.edge);
// diorama pedestal layers
box(ground,5.43,.16,4.43,0,-.38,0,materials.edge);box(ground,5.38,.10,4.38,0,-.49,0,materials.graphite);
}
function wallBase(parent,along,x,z,len,openings=[]){const thick=.12;
const axis=along==='x';const spans=[-len/2,...openings.flatMap(o=>[o.start,o.end]),len/2];
for(let i=0;i<spans.length-1;i++){const a=spans[i],b=spans[i+1];if(b-a<=.002)continue;const mid=(a+b)/2;const center=(a+b)/2;const matching=openings.find(o=>a>=o.start-.0001&&b<=o.end+.0001);if(matching){if(matching.bottom>0){box(parent,axis?b-a:thick,matching.bottom,axis?thick:b-a,axis?mid:x,matching.bottom/2,axis?z:mid,axis?materials.cream:materials.sage)}if(matching.top<H){const hei=H-matching.top;box(parent,axis?b-a:thick,hei,axis?thick:b-a,axis?mid:x,matching.top+hei/2,axis?z:mid,axis?materials.cream:materials.sage)}}else box(parent,axis?b-a:thick,H,axis?thick:b-a,axis?mid:x,H/2,axis?z:mid,axis?materials.cream:materials.sage)}
// baseboard split around openings where appropriate
let last=-len/2;for(const o of openings){if(last<o.start)box(parent,axis?o.start-last:.035,.12,axis?.035:o.start-last,axis?(last+o.start)/2:x,.07,axis?z+(z<0?.09:-.09):(last+o.start)/2,materials.white);last=o.end}if(last<len/2)box(parent,axis?len/2-last:.035,.12,axis?.035:len/2-last,axis?(last+len/2)/2:x,.07,axis?z+(z<0?.09:-.09):(last+len/2)/2,materials.white);
}
function createWalls(){wallGroups.back=group(scene);wallGroups.left=group(scene);wallGroups.front=group(scene);wallGroups.right=group(scene);
wallBase(wallGroups.back,'x',0,-2,5,[{start:.25,end:1.65,bottom:.89,top:2.22}]);wallBase(wallGroups.left,'z',-2.5,0,4);wallBase(wallGroups.right,'z',2.5,0,4);wallBase(wallGroups.front,'x',0,2,5,[{start:1.13,end:2.10,bottom:0,top:2.18}]);
createWindow(wallGroups.back);createDoor(wallGroups.front);createWallDecor();
}
function createWindow(p){const g=group(p,.95,1.55,-1.98),wood=materials.ivory;box(g,1.53,.105,.19,0,-.67,.01,wood);box(g,1.53,.10,.14,0,.72,0,wood);for(let x of [-.735,.735])box(g,.105,1.44,.16,x,0,0,wood);box(g,1.39,1.27,.018,0,.03,-.004,new THREE.MeshStandardMaterial({color:'#a9d6e4',transparent:true,opacity:.53,metalness:.12,roughness:.17,side:THREE.DoubleSide}));box(g,.06,1.35,.12,0,.02,.06,wood);box(g,1.44,.055,.12,0,.02,.06,wood);
const skyline=canvasTex(256,256,(ctx)=>{const grad=ctx.createLinearGradient(0,0,0,256);grad.addColorStop(0,'#b5d4ea');grad.addColorStop(1,'#e8e5d5');ctx.fillStyle=grad;ctx.fillRect(0,0,256,256);ctx.fillStyle='#99afb28c';for(let i=0;i<19;i++){const x=(i*51)%256,hh=20+(i*17)%80;ctx.fillRect(x,205-hh,11+i%8,hh)}ctx.fillStyle='#6c9a7caa';for(let i=0;i<28;i++)ctx.beginPath(),ctx.arc((i*43)%256,213+(i*7)%15,10+i%9,0,7),ctx.fill()});const out=canvasPlane(g,1.38,1.25,0,.03,-.09,skyline);out.material.transparent=true;out.material.opacity=.72;
for(let x of [-.67,.67]){const curtain=box(g,.24,1.4,.09,x,0,.13,materials.pillow);curtain.rotation.y=x>0?-.12:.12;for(let j=0;j<5;j++)box(g,.025,1.32,.012,x-.08+j*.038,-.04,.19,materials.cream)}box(g,1.75,.06,.14,0,.83,.05,materials.metal);createPlant(g,.54,-.56,.19,.48);
}
function createDoor(p){const g=group(p,1.615,0,2.02);box(g,1.10,.12,.19,0,2.2,0,materials.white);for(const x of [-.54,.54])box(g,.10,2.22,.18,x,1.1,0,materials.white);box(g,.95,2.06,.10,0,1.065,0,materials.walnut);for(let y of [.72,1.39])roundBox(g,.70,.47,.035,0,y,.064,materials.wood,.025);sphere(g,.055,.35,1.02,.12,materials.gold);box(g,.20,.025,.06,.40,1.02,.14,materials.gold)}
function wallPoster(p,x,y,z,w,h,tex,rotation=0){const frame=group(p,x,y,z);frame.rotation.y=rotation;box(frame,w+.08,h+.08,.035,0,0,0,materials.walnut);canvasPlane(frame,w,h,0,0,.023,tex);return frame}
function shelf(p,x,y,z,w,side=false){const g=group(p,x,y,z);if(side)g.rotation.y=Math.PI/2;box(g,w,.065,.23,0,0,0,materials.wood);for(let ix of [-w/2+.1,w/2-.1])box(g,.045,.21,.21,ix,-.14,0,materials.metal);return g}
function createWallDecor(){const back=wallGroups.back,left=wallGroups.left,right=wallGroups.right;
wallPoster(back,-1.76,1.95,-1.923,.48,.64,labelTex('NOVA','SPACE CLUB','#273d59','#e3c39e'));
wallPoster(back,-.93,2.18,-1.923,.4,.48,labelTex('PLAY','EVERY DAY','#bd8059','#fff3d9'));
const sh=shelf(left,-2.34,2.05,-.78,1.18,true);scatterBooks(sh,12,-.49,.037,0,.115);sphere(sh,.11,.47,.18,0,materials.orange);sphere(sh,.085,.19,.14,0,materials.navy);
const sh2=shelf(back,-1.37,1.29,-1.86,.75);scatterBooks(sh2,5,-.26,.035,0,.11);createPlant(sh2,.23,.06,0,.32);
wallPoster(left,-2.427,1.60,.7,.55,.72,labelTex('SKATE','OR DIE','#425a63','#f6d2a4'),Math.PI/2);
const wallclock=group(right,2.425,2.2,-.8);wallclock.rotation.y=-Math.PI/2;cyl(wallclock,.19,.035,0,0,0,materials.white);const face=mesh(wallclock,new THREE.CircleGeometry(.16,32),materials.ivory,0,.025,0);face.rotation.x=-Math.PI/2; // dial front local to wall
const hand1=box(wallclock,.025,.12,.025,0,.09,.045,materials.graphite);hand1.rotation.z=.7;
const hand2=box(wallclock,.015,.15,.025,.035,.075,.05,materials.orange);hand2.rotation.z=-.55;
}
function createBed(){const b=group(scene,-1.68,0,-.94); // mattress length runs along Z
for(let x of [-.52,.52])for(let z of [-.87,.87])box(b,.10,.26,.11,x,.21,z,materials.walnut);
roundBox(b,1.28,.21,2.08,0,.39,0,materials.walnut,.07,'Кровать');roundBox(b,1.18,.20,1.93,0,.60,0,materials.ivory,.07);roundBox(b,1.21,.58,.13,0,.70,-1.025,materials.wood,.075);for(let i=0;i<5;i++)roundBox(b,.18,.39,.06,-.44+i*.22,.69,-.94,materials.pillow,.05);
roundBox(b,1.12,.12,1.14,0,.76,.36,materials.blanket,.06);for(let i=0;i<7;i++){const crease=line(b,[[-.5+i*.16,.827,-.18],[-.52+i*.16,.839,.20],[-.5+i*.16,.824,.73]],.009,materials.blue);crease.castShadow=false}
for(let x of [-.29,.29]){const p=roundBox(b,.45,.14,.33,x,.79,-.70,materials.cream,.07);p.rotation.y=(x<0?-.1:.1)}roundBox(b,.32,.11,.30,.08,.85,.38,materials.orange,.08);
// beside the bed
const t=group(scene,-.83,0,-1.49);roundBox(t,.52,.09,.48,0,.53,0,materials.wood,.025);box(t,.49,.42,.45,0,.29,0,materials.ivory);box(t,.42,.08,.025,0,.38,.245,materials.walnut);sphere(t,.02,0,.38,.263,materials.metal);createLamp(t,-.12,.61,0,.29);box(t,.18,.014,.10,.14,.59,.09,materials.graphite);for(let z of [.46,.8]){const s=group(scene,-1.85,.03,z);roundBox(s,.20,.07,.38,0,0,0,materials.cream,.06);roundBox(s,.15,.03,.2,0,.055,.04,materials.pillow,.04)}
}
function createLamp(p,x,y,z,scale=1){const g=group(p,x,y,z);cyl(g,.10*scale,.025*scale,0,0,0,materials.gold);cyl(g,.014*scale,.31*scale,0,.15*scale,0,materials.gold);const shade=mesh(g,new THREE.CylinderGeometry(.085*scale,.17*scale,.23*scale,20),materials.ivory,0,.40*scale,0);const bulb=sphere(g,.05*scale,0,.32*scale,0,new THREE.MeshStandardMaterial({color:'#ffe9b2',emissive:'#ffc77a',emissiveIntensity:.75}));lamps.push({g,shade,bulb});return g}
function createDesk(){const desk=group(scene,.02,0,-1.48);roundBox(desk,1.78,.10,.70,0,.78,0,materials.wood,.032,'Рабочий стол');for(let x of [-.78,.78])for(let z of [-.27,.27])box(desk,.065,.73,.065,x,.37,z,materials.graphite);
box(desk,.55,.42,.59,-.59,.51,0,materials.ivory);for(let i=0;i<2;i++){box(desk,.51,.16,.014,-.59,.44+i*.175,.31,materials.cream);box(desk,.17,.021,.025,-.59,.44+i*.175,.33,materials.metal)}
box(desk,.44,.07,.23,0,.82,-.18,materials.black); // shelf riser
createComputerSetup(desk);createGamingChair();
// soft strip below tabletop
const glow=new THREE.MeshBasicMaterial({color:'#8196e8',transparent:true,opacity:.52});box(desk,1.50,.025,.025,0,.735,.33,glow);
}

function initScene(){scene=new THREE.Scene();scene.background=new THREE.Color('#e0e4df');scene.fog=new THREE.Fog('#e0e4df',14,27);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('#stage').appendChild(renderer.domElement);

function setupControls(){controls=new OrbitControls(camera,renderer.domElement);controls.target.copy(targetHome);controls.enableDamping=true;controls.dampingFactor=.06;controls.screenSpacePanning=true;controls.minZoom=.65;controls.maxZoom=3.65;controls.minPolarAngle=.07;controls.maxPolarAngle=Math.PI*.49;controls.enablePan=true;controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());controls.addEventListener('start',()=>{transition.active=false});}
function setWallMode(mode){wallMode=mode;for(const [name,g] of Object.entries(wallGroups))g.visible=mode==='all'||(mode==='back'&&(name==='back'||name==='left'));document.querySelectorAll('[data-wall]').forEach(el=>el.classList.toggle('active',el.dataset.wall===mode));}

function cameraTo(pos,target,zoom){transition.active=true;transition.start=performance.now();transition.fromPos.copy(camera.position);transition.toPos.copy(pos);transition.fromTarget.copy(controls.target);transition.toTarget.copy(target);transition.fromZoom=camera.zoom;transition.toZoom=zoom;}

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let lastPick=0;renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||performance.now()-lastPick<90)return;lastPick=performance.now();pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(pickables.filter(o=>o.visible&&isVisible(o)),false);let name=hits.length?hits[0].object.name:'';$('#tip').textContent=name;$('#tip').classList.toggle('shown',!!name);});renderer.domElement.addEventListener('pointerleave',()=>$('#tip').classList.remove('shown'));}
